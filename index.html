<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja Simples - Controle de Produtos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Loja Simples</h1>
      <p>Controle de produtos - Aula 1</p>
    </header>

    <main>
      <section class="cartao">
        <h2 id="titulo-form">Novo produto</h2>
        <form id="form-produto">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Caderno" required />

          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 12.50" required />

          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="0" placeholder="Ex: 10" required />

          <p id="mensagem-erro" class="erro" role="alert"></p>

          <button type="submit" id="botao-form">Adicionar produto</button>
        </form>
      </section>

      <section class="cartao">
        <h2>Produtos cadastrados</h2>
        <p id="contador">Produtos cadastrados: 0</p>
        <p id="mensagem-vazia">Nenhum produto cadastrado.</p>
        <ul id="lista-produtos"></ul>
      </section>
    </main>

    <footer>
      <p>Loja Simples &copy; 2026 - Projeto da disciplina de Fundamentos Web</p>
      <p>Feito com HTML, CSS e JavaScript puro</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
